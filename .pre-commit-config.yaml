repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]
        args: ['-style=file']

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        args: ['--in-place']
      - id: cmake-lint

  - repo: local
    hooks:
      - id: check-no-iostream
        name: Check no iostream in headers
        entry: bash -c 'grep -l "#include <iostream>" "$@" | grep -E "\.hpp$|\.h$" && exit 1 || exit 0'
        language: system
        types: [c++]
